<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services — Lilith's Eclipse</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      color: #E8ECF2;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.7;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    /* DEEP NAVY BASE */
    .base-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -10;
      background: radial-gradient(ellipse at 50% 50%, #071530 0%, #050E22 50%, #02060F 100%);
    }

    /* FLOWING RIBBONS */
    .ribbons {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -9;
      overflow: hidden;
      pointer-events: none;
    }
    .ribbon {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      mix-blend-mode: screen;
    }
    .ribbon-1 {
      width: 900px; height: 700px;
      background: radial-gradient(ellipse 60% 40% at 40% 50%, #2C6FB8 0%, #174C8A 30%, rgba(23, 76, 138, 0) 70%);
      top: -20%; left: -20%;
      animation: ribbonFloat1 25s ease-in-out infinite;
    }
    .ribbon-2 {
      width: 800px; height: 1200px;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, #3A82CC 0%, #174C8A 40%, rgba(23, 76, 138, 0) 75%);
      top: 5%; right: -25%;
      animation: ribbonFloat2 30s ease-in-out infinite;
      opacity: 0.45;
    }
    .ribbon-3 {
      width: 1000px; height: 800px;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, #1E5EA8 0%, #0F3B70 40%, rgba(15, 59, 112, 0) 70%);
      bottom: -25%; left: -15%;
      animation: ribbonFloat3 32s ease-in-out infinite;
      opacity: 0.5;
    }
    .ribbon-4 {
      width: 700px; height: 900px;
      background: radial-gradient(ellipse 40% 60% at 50% 50%, #4A8CD0 0%, #1E5EA8 35%, rgba(30, 94, 168, 0) 70%);
      top: 30%; left: 25%;
      opacity: 0.3;
      animation: ribbonFloat4 40s ease-in-out infinite;
    }
    .ribbon-5 {
      width: 800px; height: 700px;
      background: radial-gradient(ellipse 55% 45% at 50% 50%, #2C6FB8 0%, #174C8A 40%, rgba(23, 76, 138, 0) 70%);
      bottom: -15%; right: -20%;
      opacity: 0.35;
      animation: ribbonFloat5 38s ease-in-out infinite;
    }

    @keyframes ribbonFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      33%      { transform: translate(80px, 60px) scale(1.15) rotate(8deg); }
      66%      { transform: translate(-40px, 100px) scale(1.05) rotate(-6deg); }
    }
    @keyframes ribbonFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%      { transform: translate(-100px, 120px) scale(1.2) rotate(-10deg); }
    }
    @keyframes ribbonFloat3 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%      { transform: translate(120px, -80px) scale(1.15) rotate(6deg); }
    }
    @keyframes ribbonFloat4 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-45%, -55%) scale(1.35); }
    }
    @keyframes ribbonFloat5 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%      { transform: translate(-80px, -100px) scale(1.25) rotate(10deg); }
    }

    /* STREAKS */
    .streaks {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -8;
      overflow: hidden;
      pointer-events: none;
    }
    .streak {
      position: absolute;
      background: linear-gradient(90deg, transparent 0%, rgba(90, 150, 220, 0.65) 50%, transparent 100%);
      filter: blur(2px);
      opacity: 0.5;
      border-radius: 50%;
    }
    .streak-1 { width: 55%; height: 1.5px; top: 25%; left: 20%; transform: rotate(-25deg); animation: streakGlow1 9s ease-in-out infinite; box-shadow: 0 0 15px 3px rgba(90, 150, 220, 0.4); }
    .streak-2 { width: 40%; height: 1.5px; top: 55%; left: 40%; transform: rotate(15deg); animation: streakGlow2 11s ease-in-out infinite; box-shadow: 0 0 12px 2px rgba(90, 150, 220, 0.35); }
    .streak-3 { width: 35%; height: 1px; top: 75%; left: 10%; transform: rotate(35deg); animation: streakGlow3 13s ease-in-out infinite; box-shadow: 0 0 12px 2px rgba(90, 150, 220, 0.4); }

    @keyframes streakGlow1 { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.5; } }
    @keyframes streakGlow2 { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.55; } }
    @keyframes streakGlow3 { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.4; } }

    /* STARS */
    .starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -7;
      pointer-events: none;
      background-image: 
        radial-gradient(1px 1px at 8% 12%, rgba(232, 236, 242, 0.45), transparent),
        radial-gradient(1px 1px at 22% 28%, rgba(232, 236, 242, 0.3), transparent),
        radial-gradient(1.5px 1.5px at 38% 8%, rgba(90, 155, 212, 0.5), transparent),
        radial-gradient(1px 1px at 52% 42%, rgba(232, 236, 242, 0.35), transparent),
        radial-gradient(1.5px 1.5px at 68% 18%, rgba(70, 130, 180, 0.55), transparent),
        radial-gradient(1px 1px at 82% 52%, rgba(232, 236, 242, 0.35), transparent),
        radial-gradient(1px 1px at 12% 68%, rgba(232, 236, 242, 0.3), transparent),
        radial-gradient(1.5px 1.5px at 32% 82%, rgba(90, 155, 212, 0.45), transparent);
      animation: twinkleSoft 7s ease-in-out infinite;
    }
    @keyframes twinkleSoft { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }

    /* SHOOTING STARS */
    .shooting-star {
      position: fixed;
      width: 2px; height: 2px;
      background: #E8ECF2;
      border-radius: 50%;
      box-shadow: 0 0 10px 3px #4A9BE8, 0 0 20px 6px rgba(70, 130, 180, 0.4);
      top: 8%; left: -10%;
      z-index: -6;
      animation: shoot 25s linear infinite;
      opacity: 0;
    }
    .shooting-star::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 150px; height: 1.5px;
      background: linear-gradient(90deg, #4A9BE8, transparent);
      transform: translateX(-100%);
    }
    @keyframes shoot {
      0%   { transform: translate(0, 0); opacity: 0; }
      4%   { opacity: 1; }
      16%  { transform: translate(120vw, 50vh); opacity: 0; }
      100% { transform: translate(120vw, 50vh); opacity: 0; }
    }
    .shooting-star.delay-1 { top: 40%; animation: shoot 35s linear infinite; animation-delay: 14s; }

    /* TYPOGRAPHY */
    h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 2px; color: #E8ECF2; }
    p { font-weight: 300; color: #B9C2D0; }
    strong { color: #E8ECF2; font-weight: 600; }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(8, 17, 31, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      border-bottom: 1px solid rgba(70, 140, 210, 0.25);
      z-index: 100;
      box-shadow: 0 0 25px rgba(70, 150, 220, 0.12);
    }
    .logo { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 3px; }
    .logo a { color: #E8ECF2; text-decoration: none; }
    .nav-links a { color: #B9C2D0; text-decoration: none; margin: 0 15px; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: #E8ECF2; text-shadow: 0 0 10px rgba(90, 170, 240, 0.9); }
    #lang-toggle {
      background: rgba(20, 60, 120, 0.35);
      border: 1px solid rgba(70, 140, 210, 0.5);
      color: #E8ECF2;
      padding: 6px 18px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1px;
      border-radius: 6px;
      transition: 0.4s;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(70, 150, 220, 0.2);
    }
    #lang-toggle:hover { 
      background: rgba(70, 140, 210, 0.4); 
      border-color: rgba(90, 170, 240, 0.8);
      box-shadow: 0 8px 30px rgba(90, 170, 240, 0.5);
    }

    /* SERVICES PAGE */
    .services-page {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      position: relative;
      z-index: 1;
    }
    .services-page h1 {
      font-size: 2.5rem;
      margin-bottom: 60px;
      text-shadow: 0 0 25px rgba(70, 150, 220, 0.6);
      animation: titlePulse 7s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 22px rgba(70, 150, 220, 0.6), 0 0 45px rgba(70, 150, 220, 0.3); }
      50%      { text-shadow: 0 0 35px rgba(90, 170, 240, 0.85), 0 0 70px rgba(70, 150, 220, 0.5); }
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      max-width: 600px;
    }
    .service-link {
      display: block;
      padding: 24px 40px;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      color: #D8DEE8;
      background: rgba(20, 60, 120, 0.3);
      border: 1px solid rgba(70, 140, 210, 0.4);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 10px;
      transition: all 0.4s ease;
      box-shadow: 
        0 8px 25px rgba(0, 0, 0, 0.35),
        0 2px 12px rgba(70, 150, 220, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .service-link:hover {
      color: #E8ECF2;
      background: rgba(70, 140, 210, 0.45);
      border-color: rgba(90, 170, 240, 0.9);
      box-shadow: 
        0 15px 45px rgba(90, 170, 240, 0.55),
        0 4px 20px rgba(70, 150, 220, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      letter-spacing: 5px;
      transform: translateY(-3px);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px;
      background: rgba(5, 7, 13, 0.85); 
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(70, 140, 210, 0.2);
      font-size: 0.8rem;
      position: relative;
      z-index: 10;
    }

    body[dir="rtl"] { font-family: 'Segoe UI', Tahoma, sans-serif; }

    /* MOBILE */
    @media (max-width: 768px) {
      .services-page h1 { font-size: 1.9rem; margin-bottom: 40px; letter-spacing: 2px; }
      .service-link { font-size: 1rem; padding: 20px 25px; letter-spacing: 2px; border-radius: 8px; }
      nav { padding: 15px 20px; }
      .nav-links { display: none; }
      #lang-toggle { padding: 6px 14px; font-size: 0.75rem; }
      .ribbon-1 { width: 500px; height: 400px; filter: blur(60px); top: -15%; left: -30%; opacity: 0.45; }
      .ribbon-2 { width: 450px; height: 700px; filter: blur(60px); top: 5%; right: -35%; opacity: 0.4; }
      .ribbon-3 { width: 550px; height: 450px; filter: blur(60px); bottom: -20%; left: -25%; opacity: 0.45; }
      .ribbon-4 { width: 350px; height: 500px; filter: blur(60px); top: 35%; left: 20%; opacity: 0.25; }
      .ribbon-5 { width: 400px; height: 350px; filter: blur(60px); bottom: -10%; right: -30%; opacity: 0.3; }
      .shooting-star::after { width: 100px; }
    }
    @media (max-width: 420px) {
      .services-page h1 { font-size: 1.5rem; }
      .service-link { font-size: 0.9rem; padding: 18px 22px; letter-spacing: 1.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="base-bg"></div>

  <div class="ribbons">
    <div class="ribbon ribbon-1"></div>
    <div class="ribbon ribbon-2"></div>
    <div class="ribbon ribbon-3"></div>
    <div class="ribbon ribbon-4"></div>
    <div class="ribbon ribbon-5"></div>
  </div>

  <div class="streaks">
    <div class="streak streak-1"></div>
    <div class="streak streak-2"></div>
    <div class="streak streak-3"></div>
  </div>

  <div class="starfield"></div>

  <div class="shooting-star"></div>
  <div class="shooting-star delay-1"></div>

  <nav>
    <div class="logo"><a href="index.html">LILITH'S ECLIPSE SERVICES</a></div>
    <div class="nav-links">
      <a href="courses.html" data-en="Courses" data-ar="الدورات">Courses</a>
      <a href="sessions.html" data-en="Sessions" data-ar="الجلسات">Sessions</a>
      <a href="hypnosis.html" data-en="Hypnosis" data-ar="التنويم الإيحائي">Hypnosis</a>
      <a href="books.html" data-en="Books" data-ar="الكتب">Books</a>
      <a href="payment.html" data-en="Payment" data-ar="طرق الدفع">Payment</a>
      <a href="contact.html" data-en="Contact" data-ar="التواصل">Contact</a>
    </div>
    <button id="lang-toggle">AR | EN</button>
  </nav>

  <section class="services-page">
    <h1 data-en="CHOOSE YOUR PATH" data-ar="اختاري طريقكِ">CHOOSE YOUR PATH</h1>
    
    <div class="service-list">
      <a href="courses.html" class="service-link" data-en="Courses" data-ar="الدورات">Courses</a>
      <a href="sessions.html" class="service-link" data-en="Sessions" data-ar="الجلسات">Sessions</a>
      <a href="hypnosis.html" class="service-link" data-en="Hypnosis" data-ar="التنويم الإيحائي">Hypnosis</a>
      <a href="books.html" class="service-link" data-en="Books" data-ar="الكتب">Books</a>
      <a href="payment.html" class="service-link" data-en="Payment" data-ar="طرق الدفع">Payment</a>
      <a href="contact.html" class="service-link" data-en="Contact" data-ar="التواصل">Contact</a>
    </div>
  </section>

  <footer>
    <p>LILITH'S ECLIPSE</p>
    <p>Telegram: @xlilithec</p>
    <p>© 2026 Lilith's Eclipse. All rights reserved.</p>
  </footer>

  <script>
    const langToggle = document.getElementById('lang-toggle');
    const elementsToTranslate = document.querySelectorAll('[data-en]');
    let currentLang = localStorage.getItem('lang') || 'en';

    function applyLanguage() {
      if (currentLang === 'ar') {
        document.body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'ar';
        elementsToTranslate.forEach(el => {
          el.textContent = el.getAttribute('data-ar');
        });
        langToggle.textContent = 'EN | AR';
      } else {
        document.body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        elementsToTranslate.forEach(el => {
          el.textContent = el.getAttribute('data-en');
        });
        langToggle.textContent = 'AR | EN';
      }
    }

    applyLanguage();

    langToggle.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
    });
  </script>
</body>
</html>
